name: Build Mac downloads

on:
  workflow_dispatch:
  push:
    branches: ['ci/mac-*']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Prevent a fork made private from silently starting billed runners.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test native disk image
        env:
          VERSION: ${{ steps.version.outputs.number }}
          ARCH: ${{ matrix.arch }}
        run: bash tools/build_dmg.sh "$VERSION" --arch "$ARCH"
      - name: Save verified download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DATA-mac-${{ matrix.arch }}
          path: dist/DATA-v*-${{ matrix.arch }}.dmg*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: build
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DATA-mac-*
          path: dist
          merge-multiple: true
      - name: Verify and attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "DATA-$TAG-arm64.dmg"
          test -f "DATA-$TAG-x86_64.dmg"
          cat *.sha256 > SHA256SUMS-mac.txt
          sha256sum -c SHA256SUMS-mac.txt
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Existing release is public; attach files only after explicit review"'
          else
            printf '%s\n' 'Mac downloads for Apple Silicon and Intel.' 'Includes Python and system vitals. Unsigned and not notarized.' 'Optional voice and desktop-control dependencies are not bundled.' > notes.txt
            gh release create "$TAG" --verify-tag --draft --title "DATA $TAG" --notes-file notes.txt
          fi
          gh release upload "$TAG" *.dmg *.build.json SHA256SUMS-mac.txt
