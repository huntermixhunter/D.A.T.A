name: Build Mac downloads

on:
  workflow_dispatch:
  push:
    branches: ['ci/mac-*']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Prevent a fork made private from silently starting billed runners.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test native disk image
        env:
          VERSION: ${{ steps.version.outputs.number }}
          ARCH: ${{ matrix.arch }}
        run: bash tools/build_dmg.sh "$VERSION" --arch "$ARCH"
      - name: Save verified download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DATA-mac-${{ matrix.arch }}
          path: dist/DATA-v*-${{ matrix.arch }}.dmg*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: build
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DATA-mac-*
          path: dist
          merge-multiple: true
      - name: Verify and attach to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "DATA-$TAG-arm64.dmg"
          test -f "DATA-$TAG-x86_64.dmg"
          cat *.sha256 > SHA256SUMS-mac.txt
          sha256sum -c SHA256SUMS-mac.txt
          # Find any release carrying this tag, draft or published. `gh release
          # view` must not be used here: the tags API hides draft releases, so
          # it reported "no release" while the Windows draft existed, the else
          # branch created a second untagged draft, and the Mac downloads were
          # attached to that orphan instead of the real release (v1.0.58).
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate > all.json
          jq --arg t "$TAG" '[.[] | select(.tag_name == $t)]' all.json > existing.json
          count="$(jq length existing.json)"

          if [ "$count" -gt 1 ]; then
            echo "More than one release carries $TAG. Resolve by hand before attaching." >&2
            jq -r '.[] | "id=\(.id) draft=\(.draft)"' existing.json >&2
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            printf '%s\n' 'Mac downloads for Apple Silicon and Intel.' 'Includes Python and system vitals. Unsigned and not notarized.' 'Optional voice and desktop-control dependencies are not bundled.' > notes.txt
            gh release create "$TAG" --verify-tag --draft --title "DATA $TAG" --notes-file notes.txt
          else
            # Additive only. Never replace an asset that is already attached,
            # published or not; corrections ship as a new version.
            jq -r '.[0].assets[].name' existing.json > attached.txt
            for asset in *.dmg *.build.json SHA256SUMS-mac.txt; do
              if grep -qxF "$asset" attached.txt; then
                echo "Asset $asset is already attached to $TAG. Use a new version for corrections." >&2
                exit 1
              fi
            done
          fi

          gh release upload "$TAG" *.dmg *.build.json SHA256SUMS-mac.txt
