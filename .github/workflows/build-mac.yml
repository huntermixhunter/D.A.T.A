name: Build Mac downloads

on:
  workflow_dispatch:
  push:
    branches: ['ci/mac-*']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Prevent a fork made private from silently starting billed runners.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test native disk image
        env:
          VERSION: ${{ steps.version.outputs.number }}
          ARCH: ${{ matrix.arch }}
        run: bash tools/build_dmg.sh "$VERSION" --arch "$ARCH"
      - name: Save verified download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DATA-mac-${{ matrix.arch }}
          path: dist/DATA-v*-${{ matrix.arch }}.dmg*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: build
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Checkout must precede the artifact download: actions/checkout cleans the
      # workspace, which would delete the downloaded disk images.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DATA-mac-*
          path: dist
          merge-multiple: true
      - name: Verify and attach to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        # Resolution, the duplicate-release guard and the no-overwrite guard live
        # in a committed script so they can be tested off the runner. See the
        # module docstring for the v1.0.58 split-release failure it prevents.
        run: python3 tools/attach_mac_release.py "$TAG" dist
